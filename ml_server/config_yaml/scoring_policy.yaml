version: "scoring-v0.8.0"

thresholds:
  observe: 5
  suspicious: 9
  high_risk: 14

limits:
  ml_score_cap: 5
  max_context_discount: -4
  danger_override_max_discount: -1

scores:
  # process category
  known_miner: 10
  persistent_miner: 3
  temp_exec: 1
  appdata_exec: 1
  # episode
  dos_spike: 5
  persistent_ext: 2
  # resource
  cpu_high: 1
  cpu_flat: 1
  mem_high: 1
  mem_critical: 1
  gpu_high: 1
  top_cpu_norm_high: 2
  top_cpu_norm_mid: 1
  # network
  net_out_sustained: 2
  outbound_spike: 2
  unique_remote_ip_high: 2
  unique_remote_ip_mid: 1
  new_remote_ip_burst: 1
  spike_with_companion: 1
  # correlation — 아래는 FP=0 (P0/P1/P2 로컬 + NCP 7h39m) 로 검증된 실제 값.
  # 주의: v0.6 메모에 "FP 주범이라 2로 약화" 라 적혀 있었으나 그 변경은
  # indicator_calculator 코드에 적용된 적이 없었고(코드가 정책을 안 읽었음),
  # 검증 baseline 은 모두 아래 값에서 측정됨. 2026-05 정합화 때 코드가 정책을
  # 읽도록 바꾸면서 정책 값을 검증값으로 맞춤. 낮추려면 반드시
  # tests/integration/test_sustained_scenarios.py 재실행으로 FP 재검증.
  cpu_plus_net: 2
  disk_write_net_out: 5
  unknown_proc_net: 5
  appdata_net: 6
  mining_known: 10         # fast-path
  mining_pool_only: 8

context_discounts:
  startup: -1
  security_scan: -2
  maintenance_update: -2
  lab_agent: -1
  class_or_free: -1

# === 신규 (v0.6): 카테고리 패턴 boolean evaluator =====================
# 각 entry 에 ``enabled: false`` 를 두면 비활성화(평가 skip).
#
# catalog 8.1 절의 보류 항목 (R6/R9/N1/N6/S2/S5) 은 ``enabled: false`` +
# ``implemented: false`` 를 함께 둔다. 구분:
#   - enabled: false      = 운영자가 끈 상태 (구현돼 있으나 비활성)
#   - implemented: false  = 평가 로직 자체가 없음 → enabled 를 true 로 바꿔도
#                           작동하지 않는다 (silent no-op).
# SSOT 는 코드의 ``pattern_categories._STUB_PATTERNS`` 이며, 아래 implemented
# 플래그는 정책 파일만 보는 사람을 위한 명시적 표기다(런타임 응답의
# category_signals.enabled_but_unimplemented 로도 노출).
category_patterns:
  resource:
    R1_cpu_flat_sustained:
      threshold: { cpu_pct: 90, std: 5, window_min: 30 }
    R2_gpu_flat_sustained:
      threshold: { gpu_pct: 90, std: 5, window_min: 30 }
    R3_cpu_gpu_both_high:
      threshold: { cpu_pct: 90, gpu_pct: 90, window_min: 30 }
    R4_gpu_only_asymmetric:
      threshold: { gpu_pct: 90, cpu_pct_max: 15, window_min: 30 }
    R5_power_flatline:
      threshold: { power_std_w: 5, power_pct_of_tdp: 70, tdp_w: 250, window_min: 30 }
    R6_sm_no_tensor:
      enabled: false
      implemented: false   # 보류 — 평가 로직 미구현(켜도 작동 안 함)
      threshold: { sm_pct: 90, tensor_pct_max: 5, window_sec: 10 }
    R7_vram_low_compute_high:
      threshold: { vram_used_mb_max: 1024, gpu_pct: 90, window_min: 30 }
    R8_mem_idle_compute_high:
      threshold: { mem_used_gb_max: 4, gpu_pct: 90, window_min: 30 }
    R9_single_core_full:
      enabled: false
      implemented: false   # 보류 — 평가 로직 미구현(켜도 작동 안 함)
      threshold: { single_core_pct: 95, total_cpu_max: 40, window_min: 30 }
  network:
    N1_stratum_periodicity:
      enabled: false
      implemented: false   # 보류 — 평가 로직 미구현(켜도 작동 안 함)
      threshold: { packet_size_max: 600, period_sec: 30, window_min: 10 }
    N2_external_ip_persistent:
      threshold: { same_endpoint_minutes: 30 }
    N4_internal_zero_external_high:
      threshold: { internal_kb: 0, external_mb_min: 1, window_min: 30 }
    N5_outbound_low_cv:
      threshold: { cv_max: 0.3, window_min: 30 }
    N6_dns_burst_during_idle:
      enabled: false
      implemented: false   # 보류 — 평가 로직 미구현(켜도 작동 안 함)
      threshold: { new_domain_count: 20, user_idle_min: 30, window_min: 60 }
  system:
    S1_user_idle_high_load:
      threshold: { user_idle_min: 30, cpu_or_gpu_pct: 90, window_min: 30 }
    S2_locked_high_load:
      enabled: false
      implemented: false   # 보류 — 평가 로직 미구현(켜도 작동 안 함)
      threshold: { cpu_or_gpu_pct: 90, window_min: 30 }
    S3_high_load_disk_idle:
      threshold: { cpu_or_gpu_pct: 90, disk_mb_per_s_max: 1, window_min: 30 }
    S4_high_load_mem_idle:
      threshold: { cpu_or_gpu_pct: 90, mem_used_gb_max: 4, window_min: 30 }
    S5_process_recreation:
      enabled: false
      implemented: false   # 보류 — 평가 로직 미구현(켜도 작동 안 함)
      threshold: { recreation_count: 3, window_sec: 300 }

gating:
  mining_confirmed:
    categories_required: 3
    sustained_minutes: 180
    verdict: HIGH_RISK
  suspicious:
    categories_required: 2
    sustained_minutes: 30
    verdict: SUSPICIOUS
  observe:
    categories_required: 1
    sustained_minutes: 5
    verdict: OBSERVE

# === P0-3 (docs/fp_field_analysis_v0.6.md §7-P0-3) =====================
# 단일 신호 MEDIUM 진입 차단을 위한 promotion gating.
# Field 측정: MEDIUM 의 74% (948/1314) 가 alert 1개로 진입 → 신호 수 / 카테고리 수
# 동반 조건 추가. Fast-path 는 신호 수 무관하게 즉시 HIGH 유지.
promotion_gating:
  enabled: true
  medium:
    min_signal_count: 3
    min_category_count: 2
  high:
    min_signal_count: 4
    min_category_count: 2
  fast_path:
    # process_score >= 10 (mining_known 발화)
    - mining_known
    # category_gating 의 mining_confirmed (3 카테고리 + 3h sustained)
    - confirmed_sustained
    # alerts 에 CONFIRMED_MINING type 존재
    - alerts_contain_confirmed_mining

# === P1-2 (docs/fp_field_analysis_v0.6.md §7-P1-2) =====================
# DOS / network spike 절대값 floor. 비율(avg 대비 N배) 만으론 baseline 이
# 0.03MB 일 때 2.5MB 도 80배가 되어 정상 download burst 가 dos_spike 로
# 잡힌다. 절대값 + 연속 N회 조건을 함께 만족해야 발화.
dos_detection:
  # 평균 대비 비율 외에 절대값 floor (MB / 5s). 미달이면 dos_spike False.
  # FP-fix #3 (pilot 2026-05): 20→100. 워크스테이션은 대용량 다운로드(게임/업데이트/
  # 스트리밍)가 20~50MB/5s 를 흔히 찍어 정상 download 가 DOS 로 오탐(pilot PC-01
  # 42·108MB/5s). inbound 볼륨만으론 정상 download 와 flood 를 구분 못 하므로
  # floor 를 높이고(100=20MB/s) 연속성도 강화. 실효 차단은 network-only cap(#1)
  # 이 담당; 본 floor 는 DOS_SUSPECTED alert 노이즈 저감 목적.
  min_inbound_mb_per_5s: 100.0
  # 연속 spike 횟수 — N회 이상 연속해서 비율+절대값 모두 만족해야 발화.
  # 2→3: 15초+(5s×3) 지속해야 발화 → 짧은 download burst 제외.
  min_sustained_count: 3

# === P1-3 (docs/fp_field_analysis_v0.6.md §7-P1-3) =====================
# episode score 빠른 decay + alert cooldown.
# - episode_decay_after_normal_count: rule_score_history 에 0 점이 N회
#   연속 추가되면 deque 를 즉시 비워 누적 가중치를 끊는다. 기본 12
#   = 1분 (5초 × 12). 0 = decay 비활성.
# - alert_cooldown_seconds: 동일 (pc_id, anomaly_type) 의 anomaly_history
#   persist 사이 최소 간격 (Spring AlertService 측 dedupe). 기본 60.
episode_dedupe:
  episode_decay_after_normal_count: 12
  alert_cooldown_seconds: 60
